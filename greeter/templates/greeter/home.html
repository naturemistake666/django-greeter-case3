{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приветствие</title>
  <link rel="stylesheet" href="{% static 'greeter/style.css' %}">
</head>
<body>

  <main class="card">

    {% if greeting_name %}
      <p class="greeting">Здравствуйте, {{ greeting_name }}!</p>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}

      <label for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
      {{ form.name }}

      {% if form.name.errors %}
        <ul class="errors">
          {% for error in form.name.errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      {% endif %}

      <button type="submit">Submit</button>
    </form>

  </main>

</body>
</html>
