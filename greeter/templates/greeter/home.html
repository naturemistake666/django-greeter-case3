{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приветствие</title>
  <link rel="stylesheet" href="{% static 'greeter/style.css' %}">
</head>
<body>

  <div class="card">

    {% if greeting_name %}
      <p class="greeting">Здравствуйте, {{ greeting_name }}!</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <label for="name">Ваше имя</label>
      <input type="text" name="name" id="name" placeholder="Введите ваше имя">

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <button type="submit">Отправить</button>
    </form>

  </div>

</body>
</html>
